<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NeoEnglish Translator</title>
<style>
  :root {
    --bg: #0f0f12;
    --panel: #1c1c22;
    --panel2: #26262e;
    --text: #f3f3f3;
    --muted: #b8b8c2;
    --accent: #7aa2f7;
    --border: #34343d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 32px 16px;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #0c0c10, #15151a);
    color: var(--text);
  }

  .container {
    max-width: 980px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 18px 48px rgba(0,0,0,.35);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 2rem;
  }

  .sub {
    margin: 0 0 18px;
    color: var(--muted);
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 12px;
    margin-bottom: 12px;
  }

  textarea, select, button {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #101015;
    color: var(--text);
    font-size: 16px;
  }

  textarea {
    min-height: 160px;
    resize: vertical;
    padding: 14px;
    outline: none;
  }

  select {
    padding: 14px;
    outline: none;
  }

  button {
    padding: 14px 18px;
    cursor: pointer;
    background: var(--accent);
    color: #0c1020;
    font-weight: 700;
    transition: transform .08s ease, opacity .15s ease;
  }

  button:hover { opacity: .95; }
  button:active { transform: translateY(1px); }

  .output {
    margin-top: 16px;
    padding: 16px;
    min-height: 76px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 14px;
    font-size: 1.2rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .hint {
    margin-top: 12px;
    color: var(--muted);
    font-size: .95rem;
  }

  code {
    background: #111118;
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>NeoEnglish Translator</h1>
    <p class="sub">SVO order, sound swaps, macrons, and speaker-based pronouns.</p>

    <div class="grid">
      <textarea id="input" placeholder="Type English here..."></textarea>
      <select id="speaker">
        <option value="masculine">Masculine speaker</option>
        <option value="feminine">Feminine speaker</option>
      </select>
    </div>

    <div class="grid">
      <button onclick="translateText()">Translate</button>
      <button onclick="clearAll()">Clear</button>
    </div>

    <div class="output" id="output"></div>

    <div class="hint">
      Example: <code>The quick brown fox jumped over the lazy logs.</code>
    </div>
  </div>

<script>
  function clearAll() {
    document.getElementById("input").value = "";
    document.getElementById("output").textContent = "";
  }

  function stripToken(token) {
    return token.replace(/^[^a-zA-Z]+|[^a-zA-Z]+$/g, "");
  }

  function swapHF(word) {
    word = word.replaceAll("h", "¤");
    word = word.replaceAll("f", "h");
    word = word.replaceAll("¤", "f");
    return word;
  }

  function swapSZ(word) {
    word = word.replaceAll("s", "§");
    word = word.replaceAll("z", "s");
    word = word.replaceAll("§", "z");
    return word;
  }

  function applySuffixRules(word) {
    if (word.endsWith("ed")) {
      word = word.slice(0, -2) + "ʖ";
    }
    if (word.endsWith("er")) {
      word = word.slice(0, -2) + "ɻ";
    }
    return word;
  }

  function applySoundRules(word) {
    word = word.replaceAll("sh", "ʃ");
    word = word.replaceAll("ch", "ƹ");
    word = word.replaceAll("th", "Ꝛ");
    word = word.replaceAll("ng", "Ŋ");
    word = word.replaceAll("q", "kw");
    word = word.replaceAll("c", "");
    word = word.replaceAll("x", "");

    // quick -> kwik
    word = word.replace(/^kw([aeiou])/, "kw");

    return word;
  }

  function applyMacrons(word) {
    const vowelPairs = {
      "aa": "ā",
      "ee": "ē",
      "ii": "ī",
      "oo": "ō",
      "uu": "ū"
    };

    for (const pair in vowelPairs) {
      word = word.replaceAll(pair, vowelPairs[pair]);
    }

    const consonants = ["bb","dd","ff","gg","hh","jj","kk","ll","mm","nn","pp","rr","ss","tt","vv","ww","yy","zz"];
    for (const pair of consonants) {
      const base = pair[0];
      const marked = base + "\u0304";
      word = word.replaceAll(pair, marked);
    }

    return word;
  }

  function translateWord(word, speaker) {
    let w = word.toLowerCase();
    w = stripToken(w);

    if (!w) return "";

    if (w === "my") return speaker === "masculine" ? "hy" : "sy";
    if (w === "myself") return speaker === "masculine" ? "hyself" : "syself";

    w = applySuffixRules(w);
    w = applySoundRules(w);
    w = swapHF(w);
    w = swapSZ(w);
    w = applyMacrons(w);

    return w;
  }

  function tokenize(text) {
    return text.trim().split(/\s+/).filter(Boolean);
  }

  function detectEnding(text) {
    const last = text.trim().slice(-1);
    if (last === "?") return "-qu";
    if (last === "!") return "-ex";
    return "-en";
  }

  function stripEndingPunctuation(text) {
    return text.trim().replace(/[.!?]+$/, "");
  }

  function translateText() {
    let text = document.getElementById("input").value.trim();
    const speaker = document.getElementById("speaker").value;
    const output = document.getElementById("output");

    if (!text) {
      output.textContent = "";
      return;
    }

    const ending = detectEnding(text);
    text = stripEndingPunctuation(text);

    const words = tokenize(text);
    const translated = words
      .map(word => translateWord(word, speaker))
      .filter(Boolean)
      .join(" ") + ending;

    output.textContent = translated;
  }
</script>
</body>
</html>
